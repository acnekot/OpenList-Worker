<!-- @dsCard group="Overlays" height=250 subtitle="New folder dialog" -->
<style>body{margin:0;padding:24px;background:var(--surface-100);color:var(--ink);font:14px/20px var(--font-sans)}
.dlg{display:grid;gap:10px;width:min(24rem,100%);padding:var(--space-4);border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--surface-200);color:var(--ink);box-shadow:var(--shadow-dialog)}
h3{margin:0;font:600 18px/26px var(--font-sans)}
input{padding:8px;border:1px solid var(--border);border-radius:6px;background:var(--surface-100);color:var(--ink);font:inherit}
.r{display:flex;justify-content:flex-end;gap:8px}
button{padding:6px 12px;border-radius:6px;border:1px solid var(--border);background:var(--surface-100);color:var(--ink);font:inherit;cursor:pointer}
button.p{background:var(--brand-hover);border-color:var(--brand-hover);color:#fff}</style>
<div class="dlg"><h3>New folder</h3><input value="Photos 2026" aria-label="Folder name"><div class="r"><button>Cancel</button><button class="p">Create</button></div></div>
