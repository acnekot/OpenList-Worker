<!-- @dsCard group="Actions" height=96 subtitle="Primary and outline" -->
<style>body{margin:0;padding:24px;background:var(--surface-100);color:var(--ink);font:14px/20px var(--font-sans);display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
.b{display:inline-flex;align-items:center;padding:7px 13px;border:0;border-radius:var(--radius-md);font:600 14.4px/20px var(--font-sans);cursor:pointer;transition:transform .2s}
.b:active{transform:scale(.95)}.b:focus-visible{outline:2px solid currentColor;outline-offset:2px}
.p{background:var(--brand);color:#fff}.p:hover{background:var(--brand-hover)}
.o{background:transparent;color:var(--brand);border:1px solid var(--brand);font-size:13.6px;padding:6px 12px}
.o:hover{background:var(--brand-tint)}.d{opacity:.55;cursor:default}</style>
<button class="b p">Upload</button><button class="b o">New folder</button><button class="b p d" disabled>Uploading…</button>
